<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Karesi Beyi ürün kataloğu.">
  <title>Ürünler | Karesi Beyi</title>
  <link rel="icon" type="image/png" href="assets/KB.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="products-page.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/" aria-label="Karesi Beyi ana sayfa">
        <span class="brand-mark"><img src="assets/logo.png" alt="Karesi Beyi"></span>
      </a>
      <nav class="nav" id="siteNav">
        <a href="/">Karesi Beyi</a>
        <a class="active" href="/products.html">Ürünler</a>
        <a href="/products.html">Katalog</a>
        <a href="/#hakkimizda">Hakkımızda</a>
        <a href="/#iletisim">İletişim</a>
        <a class="cart-btn" href="/#top">Sepet <span id="catalogCartCount">0</span></a>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Menüyü aç" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="catalog-hero">
      <div class="container">
        <span class="kicker">Karesi Beyi kataloğu</span>
        <h1>Lezzetinizi seçin.</h1>
        <p>Günlük sofralarınıza eşlik edecek ürünleri keşfedin.</p>
      </div>
    </section>
    <section class="catalog-section">
      <div class="container">
        <div class="catalog-toolbar">
          <label class="catalog-search">
            <span>Ürün ara</span>
            <input id="productSearch" type="search" placeholder="Kahve, kuruyemiş, kolonya..." autocomplete="off">
          </label>
          <div class="catalog-filters" id="categoryFilters" aria-label="Ürün kategorileri"></div>
        </div>
        <div id="catalogGrid" class="catalog-grid"></div>
      </div>
    </section>
  </main>
  <footer><div class="container">© <span id="year"></span> Karesi Beyi</div></footer>
  <script src="products-page.js"></script>
</body>
</html>
